server {
    listen 80;
    listen [::]:80;
    server_name app.liveuin.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location = / {
        return 302 https://$host/app/member;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.liveuin.com;

    ssl_certificate     /etc/letsencrypt/live/app.liveuin.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.liveuin.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;

    root /var/www/liveuin;
    index index.html;

    add_header X-LiveUin-Layer "app_member_site" always;
    add_header X-LiveUin-Service "liveuin-app-ui" always;
    add_header X-Content-Type-Options "nosniff" always;
    include /etc/nginx/snippets/liveuin_public_static_security_headers.conf;

    location = / {
        return 302 /app/member;
    }

    # ---- step 30 (2026-10-16): real app sign-in routes -> identity-public-prod on 9098 (everything else stays on 9095) ----
    location = /api/core/identity/providers/apple/notifications { return 404; }

    location = /api/core/identity/sessions/password {
        limit_req zone=lu_app_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location = /api/core/identity/registrations {
        limit_req zone=lu_app_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location ^~ /api/core/identity/registrations/ {
        limit_req zone=lu_app_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location = /api/core/identity/password-resets/request {
        limit_req zone=lu_app_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location ^~ /api/core/identity/password-resets/ {
        limit_req zone=lu_app_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location = /api/core/identity/providers/status {
        limit_req zone=lu_app_prov burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location ^~ /api/core/identity/providers/ {
        limit_req zone=lu_app_prov burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location = /api/core/identity/onboarding/status {
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location = /api/core/identity/onboarding/complete {
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location = /api/core/identity/profile {
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    # ---- step 30c (2026-10-16): logout/refresh revoke refresh tokens in identity; deletion cancel/status. EXACT paths only. ----
    location = /api/core/identity/logout {
        limit_req zone=lu_app_prov burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location = /api/core/identity/sessions/refresh {
        limit_req zone=lu_app_prov burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location = /api/core/identity/account-deletion/cancel {
        limit_req zone=lu_app_auth burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location = /api/core/identity/account-deletion/status {
        limit_req zone=lu_app_prov burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }
    # ---- end step 30c ----

    # ---- end step 30 ----

    # Native resident and private LocalPro API traffic must reach LiveUIN Core/Identity/Ops.
    # Keep the public/member SPA fallback below for UI routes only.
    # Public native session resolution uses the owning production Identity store.
    location = /api/core/identity/session/resolve {
        include /etc/nginx/snippets/liveuin-app-identity-proxy.conf;
    }

    location ^~ /api/core/identity/ {
        proxy_pass http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location = /api/ops/auth/google {
        proxy_pass http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ops/auth/google/ {
        proxy_pass http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/core/vendor/ {
        proxy_pass http://127.0.0.1:9095;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /api/ops/ { return 404; }
    location ^~ /api/studio/ { return 404; }
    location ^~ /api/autopilot/ { return 404; }
    location ^~ /internal/ { return 404; }
    location ^~ /registry/ { return 404; }
    location ^~ /admin/ { return 404; }

    location ^~ /api/public/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location = /api/core/public-theme {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/core/public-theme/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location ^~ /api/core/public-cms/ {
        proxy_pass http://127.0.0.1:9080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }


    location = /.well-known/apple-app-site-association {
        default_type application/json;
        try_files $uri =404;
    }

    location = /.well-known/assetlinks.json {
        default_type application/json;
        try_files $uri =404;
    }

    # AUTH02 App entry only; the shared Partner index remains unchanged.
    location = /index.html {
        alias /var/www/liveuin-auth02-releases/auth02-2c3dd7ac316e7cbe/app-entry.html;
        default_type text/html;
        add_header X-LiveUin-Layer "app_member_site" always;
        add_header X-LiveUin-Service "liveuin-app-ui" always;
        add_header X-Content-Type-Options "nosniff" always;
        include /etc/nginx/snippets/liveuin_public_static_security_headers.conf;
        add_header Cache-Control "no-store" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
